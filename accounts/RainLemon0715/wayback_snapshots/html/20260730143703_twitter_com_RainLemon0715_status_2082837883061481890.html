  年少时的窘迫会制约少年或少女的一生吗？大概率是会的。不过真的一点办法没有了吗？肯定是不会的。如果灵魂不小心倒塌了，那就试着在废墟上再建设出更加强大的高塔。
  <br/>
  有一句话这么说：“人只有在缺少某物的时候，才会了解到其究竟多么珍贵。”铁窗里的罪犯向往自由，白床上的病号希望健康，街边的流浪汉祈祷遮蔽，高楼里的职员期许顺遂。这就是说无论是向前进，还是向后看，都会让人感到忧愁。
  <br/>
  可是我们也难以有先天下忧而后天下乐的心境，只能期望看到这里的所有人，走出自己年少时心灵的困境。
  <br/>
  祝大家都可以从痛苦中坦然走出，虽然很难。
